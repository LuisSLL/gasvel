<!DOCTYPE html>
<html lang="es" data-theme="<?!= theme ?>">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><?= typeof title !== 'undefined' ? title : 'GASVEL - Restaurante' ?></title>

  <!-- CDNs de Estilos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    <?!= HtmlService.createHtmlOutputFromFile('CSS_Home').getContent(); ?>
  </style>

  <!-- Script global de URL y prevención de parpadeo de tema (FOUC) -->
  <script>
    const SCRIPT_URL = '<?= scriptUrl ?>';
    (function() {
      const savedTheme = localStorage.getItem('gasvel_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body data-theme="<?!= theme ?>">

  <!-- HEADER / TOPBAR -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">G</span>
        <div class="brand-text">
          <span class="brand-name">GASVEL</span>
          <span class="brand-sub">Cocina &amp; Barra</span>
        </div>
      </div>

      <div class="topbar-actions">
        
        <!-- Mesa Badge (Oculto por defecto) -->
        <span class="mesa-badge" id="mesaBadge" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
          </svg>
          Mesa <span id="mesaNumero"></span>
        </span>

        <!-- BOTONES DE AUTENTICACIÓN (Público) -->
        <div id="authButtons" class="auth-buttons" style="display: flex;">
          <a href="<?= scriptUrl ?>?p=registro" class="register-btn" id="btnRegister">
            <img src="https://img.icons8.com/ios-glyphs/30/ffffff/user--v1.png" alt="Registrarse" class="btn-icon-img">
            <span>Registrarse</span>
          </a>
          <a href="<?= scriptUrl ?>?p=login" class="login-btn" id="btnLogin">
            <img src="https://img.icons8.com/ios-glyphs/30/ffffff/login-rounded-right.png" alt="Ingresar" class="btn-icon-img">
            <span>Ingresar</span>
          </a>
        </div>

        <!-- BOTONES DE USUARIO (Logueado) -->
        <div id="userButtons" class="user-buttons" style="display: none;">
          <div class="admin-chip">
            <div class="admin-avatar" id="userAvatar">U</div>
            <span class="admin-name" id="userName">Usuario</span>
          </div>
          <button type="button" class="logout-btn" id="btnLogout" onclick="logoutUser()">
            <img src="https://img.icons8.com/ios-glyphs/30/ffffff/exit.png" alt="Salir" class="btn-icon-img">
            <span>Salir</span>
          </button>
        </div>

        <!-- Toggle de Tema -->
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema" onclick="toggleTheme()">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb">
              <img src="https://img.icons8.com/ios-glyphs/30/ffffff/sun--v1.png" alt="Sol" class="icon-sun-img">
              <img src="https://img.icons8.com/ios-glyphs/30/ffffff/moon-symbol.png" alt="Luna" class="icon-moon-img">
            </span>
          </span>
        </button>

      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL (Única etiqueta main del sistema) -->
  <main>
    <?!= content ?>
  </main>

  <!-- CDNs de Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <? } ?>

</html>
