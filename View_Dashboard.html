<!-- View_Dashboard.html -->
<div class="content-header p-0 mb-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h1 class="page-title m-0">Gestión de Usuarios</h1>
    <button type="button" class="btn btn-navy" data-toggle="modal" data-target="#modalCrearUsuario">
      <i class="fas fa-user-plus mr-1"></i> Crear Usuario
    </button>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="card card-outline card-navy">
      <div class="card-body">
        <table id="usersTable" class="table table-striped table-hover w-100">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Rol</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <? if (typeof users !== 'undefined' && users.length > 0) { ?>
              <? for (var i = 0; i < users.length; i++) { ?>
                <tr>
                  <td><?= users[i].user_id ?></td>
                  <td><?= users[i].nombre ?></td>
                  <td><?= users[i].apellido || '' ?></td>
                  <td><?= users[i].telefono || '' ?></td>
                  <td><?= users[i].email ?></td>
                  <td>
                    <span class="badge <?= parseInt(users[i].rol_id) === 1 ? 'badge-danger' : (parseInt(users[i].rol_id) === 2 ? 'badge-info' : (parseInt(users[i].rol_id) === 3 ? 'badge-warning' : 'badge-secondary')) ?>">
                       <?= parseInt(users[i].rol_id) === 1 ? 'Admin' : (parseInt(users[i].rol_id) === 2 ? 'Cajero' : (parseInt(users[i].rol_id) === 3 ? 'Cocina' : 'Cliente')) ?>
                    </span>
                  </td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-warning" onclick="openEditUserModal('<?= users[i].user_id ?>')" title="Editar">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDeleteUser('<?= users[i].user_id ?>')" title="Eliminar">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              <? } ?>
            <? } ?>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- MODAL CREAR USUARIO -->
<div class="modal fade" id="modalCrearUsuario" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-user-plus mr-2"></i>Crear Nuevo Usuario</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formCrearUsuario">
        <div class="modal-body">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="create_nombre" class="form-control" placeholder="Nombre completo" required>
          </div>
          <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="create_apellido" class="form-control" placeholder="Apellido">
          </div>
          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="create_email" class="form-control" placeholder="correo@empresa.com" required>
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" id="create_telefono" class="form-control" placeholder="555-0000">
          </div>
          <div class="form-group">
            <label>WhatsApp</label>
            <input type="text" id="create_wpp" class="form-control" placeholder="+54911000000">
          </div>
          <div class="form-group">
            <label>Rol de Sistema</label>
            <select id="create_roleId" class="form-control" required>
              <option value="">Seleccionar rol...</option>
              <option value="1">Admin</option>
              <option value="2">Cajero</option>
              <option value="3">Cocina</option>
              <option value="4">Cliente</option>
            </select>
          </div>
          <div class="form-group">
            <label>Contraseña Temporaria</label>
            <input type="password" id="create_password" class="form-control" placeholder="******" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Crear Usuario</button>
        </div>
      </form>
    </div>
  </div>
</div>
