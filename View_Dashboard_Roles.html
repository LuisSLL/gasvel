<!-- View_Dashboard_Roles.html -->
<div class="content-header p-0 mb-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h1 class="page-title m-0">Gestión de Roles</h1>
    <button type="button" class="btn btn-navy" data-toggle="modal" data-target="#modalCrearRol">
      <i class="fas fa-plus mr-1"></i> Crear Rol
    </button>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="card card-outline card-navy">
      <div class="card-body">
        <table id="rolesTable" class="table table-striped table-hover w-100">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Usuarios</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <? if (roles && roles.length > 0) { ?>
              <? for (var i = 0; i < roles.length; i++) { ?>
                <? var esBase = [1,2,3,4].indexOf(parseInt(roles[i].rol_id)) !== -1; ?>
                <tr>
                  <td><?= roles[i].rol_id ?></td>
                  <td><?= roles[i].nombre ?></td>
                  <td><?= roles[i].descripcion || '' ?></td>
                  <td><span class="badge badge-info"><?= roles[i].total_usuarios ?></span></td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-warning" onclick="openEditRolModal(<?= roles[i].rol_id ?>)" title="Editar">
                      <i class="fas fa-edit"></i>
                    </button>
                    <? if (!esBase) { ?>
                      <button class="btn btn-sm btn-danger" onclick="confirmDeleteRol(<?= roles[i].rol_id ?>)" title="Eliminar">
                        <i class="fas fa-trash"></i>
                      </button>
                    <? } ?>
                  </td>
                </tr>
              <? } ?>
            <? } ?>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- MODAL CREAR ROL -->
<div class="modal fade" id="modalCrearRol" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-plus mr-2"></i>Crear Rol</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formCrearRol" onsubmit="guardarRol(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="create_rol_nombre" class="form-control" placeholder="Ej: SUPERVISOR" required>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <input type="text" id="create_rol_desc" class="form-control" placeholder="Descripción opcional">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Crear</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL EDITAR ROL -->
<div class="modal fade" id="modalEditarRol" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-edit mr-2"></i>Editar Rol</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formEditarRol" onsubmit="actualizarRol(event)">
        <div class="modal-body">
          <input type="hidden" id="edit_rol_id">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="edit_rol_nombre" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <input type="text" id="edit_rol_desc" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  var baseUrl = (typeof SCRIPT_URL !== 'undefined' && SCRIPT_URL) ? SCRIPT_URL : '<?= scriptUrl ?>';
  var __rolesData = <?!= json_encode(roles) ?>;

  window.openEditRolModal = function(rolId) {
    var rol = __rolesData.find(function(r) { return String(r.rol_id) === String(rolId); });

    if (rol) {
      document.getElementById('edit_rol_id').value = rol.rol_id;
      document.getElementById('edit_rol_nombre').value = rol.nombre || '';
      document.getElementById('edit_rol_desc').value = rol.descripcion || '';
      $('#modalEditarRol').modal('show');
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Rol no encontrado' });
    }
  };

  window.guardarRol = function(event) {
    event.preventDefault();
    var payload = {
      nombre: document.getElementById('create_rol_nombre').value,
      descripcion: document.getElementById('create_rol_desc').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        var data = JSON.parse(response);
        if (data.success) {
          $('#modalCrearRol').modal('hide');
          Swal.fire({ icon: 'success', title: '¡Rol creado!', timer: 2000 });
          window.top.location.href = baseUrl + '?p=dashboard/roles';
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .createRol(payload);
  };

  window.actualizarRol = function(event) {
    event.preventDefault();
    var payload = {
      rol_id: document.getElementById('edit_rol_id').value,
      nombre: document.getElementById('edit_rol_nombre').value,
      descripcion: document.getElementById('edit_rol_desc').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        var data = JSON.parse(response);
        if (data.success) {
          $('#modalEditarRol').modal('hide');
          Swal.fire({ icon: 'success', title: '¡Rol actualizado!', timer: 2000 });
          window.top.location.href = baseUrl + '?p=dashboard/roles';
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .updateRol(payload);
  };

  window.confirmDeleteRol = function(rolId) {
    Swal.fire({
      title: '¿Eliminar este rol?',
      showCancelButton: true,
      confirmButtonColor: '#E2572B',
      confirmButtonText: 'Sí, eliminar'
    }).then(function(result) {
      if (result.isConfirmed) {
        google.script.run
          .withSuccessHandler(function(response) {
            var data = JSON.parse(response);
            if (data.success) {
              Swal.fire({ icon: 'success', title: '¡Rol eliminado!', timer: 2000 });
              window.top.location.href = baseUrl + '?p=dashboard/roles';
            } else {
              Swal.fire({ icon: 'error', title: 'Error', text: data.message });
            }
          })
          .deleteRol({ rol_id: rolId });
      }
    });
  };
</script>
