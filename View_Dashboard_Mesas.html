<!-- View_Dashboard_Mesas.html -->
<div class="content-header p-0 mb-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h1 class="page-title m-0">Gestión de Mesas</h1>
    <button type="button" class="btn btn-navy" data-toggle="modal" data-target="#modalCrearMesa">
      <i class="fas fa-plus mr-1"></i> Crear Mesa
    </button>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="card card-outline card-navy">
      <div class="card-body">
        <table id="mesasTable" class="table table-striped table-hover w-100">
          <thead>
            <tr>
              <th>Mesa #</th>
              <th>Capacidad</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="mesasTbody">
            <? if (mesas && mesas.length > 0) { ?>
              <? for (var i = 0; i < mesas.length; i++) { ?>
                <? var m = mesas[i]; ?>
                <tr id="mesa-row-<?= m.mesa_num ?>">
                  <td class="mesa-num">#<?= m.mesa_num ?></td>
                  <td class="mesa-cap"><?= m.capacidad ?> personas</td>
                  <td class="mesa-estado">
                    <select class="form-control form-control-sm d-inline-block w-auto badge-select" onchange="cambiarEstadoMesa(<?= m.mesa_num ?>, this.value)">
                      <? for (var j = 0; j < estados.length; j++) { ?>
                        <option value="<?= estados[j] ?>" <?= estados[j] === m.estado ? 'selected' : '' ?>><?= estados[j] ?></option>
                      <? } ?>
                    </select>
                  </td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-warning" onclick="openEditMesaModal(<?= m.mesa_num ?>)" title="Editar">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDeleteMesa(<?= m.mesa_num ?>)" title="Eliminar">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              <? } ?>
            <? } ?>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- MODAL CREAR MESA -->
<div class="modal fade" id="modalCrearMesa" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-plus mr-2"></i>Crear Mesa</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formCrearMesa" onsubmit="guardarMesa(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Número de mesa</label>
            <input type="number" min="1" id="create_mesa_num" class="form-control" placeholder="Ej: 11" required>
          </div>
          <div class="form-group">
            <label>Capacidad (personas)</label>
            <input type="number" min="1" id="create_mesa_cap" class="form-control" placeholder="4" value="4">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Crear</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL EDITAR MESA -->
<div class="modal fade" id="modalEditarMesa" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-edit mr-2"></i>Editar Mesa</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formEditarMesa" onsubmit="actualizarMesa(event)">
        <div class="modal-body">
          <input type="hidden" id="edit_mesa_num">
          <div class="form-group">
            <label>Capacidad (personas)</label>
            <input type="number" min="1" id="edit_mesa_cap" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  var baseUrl = (typeof SCRIPT_URL !== 'undefined' && SCRIPT_URL) ? SCRIPT_URL : '<?= scriptUrl ?>';
  var __mesasData = <?!= json_encode(mesas) ?>;
  var __estadosMesa = <?!= json_encode(estados) ?>;

  // ==========================================
  // HELPERS DE RENDER EN VIVO
  // ==========================================

  function renderOpcionesEstado(estadoActual) {
    return __estadosMesa.map(function(e) {
      return '<option value="' + e + '" ' + (e === estadoActual ? 'selected' : '') + '>' + e + '</option>';
    }).join('');
  }

  function renderFilaMesa(m) {
    return '' +
      '<tr id="mesa-row-' + m.mesa_num + '">' +
        '<td class="mesa-num">#' + m.mesa_num + '</td>' +
        '<td class="mesa-cap">' + m.capacidad + ' personas</td>' +
        '<td class="mesa-estado">' +
          '<select class="form-control form-control-sm d-inline-block w-auto badge-select" onchange="cambiarEstadoMesa(' + m.mesa_num + ', this.value)">' +
            renderOpcionesEstado(m.estado) +
          '</select>' +
        '</td>' +
        '<td class="text-center">' +
          '<button class="btn btn-sm btn-warning" onclick="openEditMesaModal(' + m.mesa_num + ')" title="Editar">' +
            '<i class="fas fa-edit"></i>' +
          '</button> ' +
          '<button class="btn btn-sm btn-danger" onclick="confirmDeleteMesa(' + m.mesa_num + ')" title="Eliminar">' +
            '<i class="fas fa-trash"></i>' +
          '</button>' +
        '</td>' +
      '</tr>';
  }

  function actualizarFilaMesa(mesaNum, data) {
    var tr = document.getElementById('mesa-row-' + mesaNum);
    if (!tr) return;

    if (data.capacidad !== undefined) {
      tr.querySelector('.mesa-cap').textContent = data.capacidad + ' personas';
    }
    if (data.estado !== undefined) {
      var sel = tr.querySelector('.mesa-estado select');
      if (sel) sel.value = data.estado;
    }

    // Actualizar caché
    var idx = __mesasData.findIndex(function(m) {
      return String(m.mesa_num) === String(mesaNum);
    });
    if (idx !== -1) {
      if (data.capacidad !== undefined) __mesasData[idx].capacidad = data.capacidad;
      if (data.estado !== undefined) __mesasData[idx].estado = data.estado;
    }
  }

  function agregarFilaMesa(m) {
    var tbody = document.getElementById('mesasTbody');
    if (!tbody) return;

    tbody.insertAdjacentHTML('beforeend', renderFilaMesa(m));
    __mesasData.push(m);

    // Reordenar por mesa_num
    var filas = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    filas.sort(function(a, b) {
      var idA = parseInt(a.querySelector('.mesa-num').textContent.replace('#', ''), 10) || 0;
      var idB = parseInt(b.querySelector('.mesa-num').textContent.replace('#', ''), 10) || 0;
      return idA - idB;
    });
    filas.forEach(function(f) { tbody.appendChild(f); });

    // Animación de entrada
    var nuevaFila = document.getElementById('mesa-row-' + m.mesa_num);
    if (nuevaFila) {
      nuevaFila.style.opacity = '0';
      nuevaFila.style.transition = 'opacity .3s ease';
      requestAnimationFrame(function() { nuevaFila.style.opacity = '1'; });
    }
  }

  function eliminarFilaMesa(mesaNum) {
    var tr = document.getElementById('mesa-row-' + mesaNum);
    if (!tr) return;

    tr.style.transition = 'opacity .3s ease';
    tr.style.opacity = '0';
    setTimeout(function() {
      tr.remove();
      __mesasData = __mesasData.filter(function(m) {
        return String(m.mesa_num) !== String(mesaNum);
      });
    }, 300);
  }

  // ==========================================
  // MODAL EDITAR
  // ==========================================
  window.openEditMesaModal = function(mesaNum) {
    var mesa = __mesasData.find(function(m) {
      return String(m.mesa_num) === String(mesaNum);
    });

    if (mesa) {
      document.getElementById('edit_mesa_num').value = mesa.mesa_num;
      document.getElementById('edit_mesa_cap').value = mesa.capacidad || 4;
      $('#modalEditarMesa').modal('show');
    } else {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Mesa no encontrada' });
    }
  };

  // ==========================================
  // CREAR (en vivo)
  // ==========================================
  window.guardarMesa = function(event) {
    event.preventDefault();

    var btn = document.querySelector('#formCrearMesa button[type="submit"]');
    var originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Creando...';

    var payload = {
      mesa_num: document.getElementById('create_mesa_num').value,
      capacidad: document.getElementById('create_mesa_cap').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        btn.disabled = false;
        btn.innerHTML = originalText;

        if (data.success) {
          $('#modalCrearMesa').modal('hide');

          // 🔥 ACTUALIZACIÓN EN VIVO
          if (data.mesa) {
            agregarFilaMesa(data.mesa);
          }

          document.getElementById('formCrearMesa').reset();
          document.getElementById('create_mesa_cap').value = '4';

          Swal.fire({
            icon: 'success',
            title: '¡Mesa creada!',
            timer: 1200,
            showConfirmButton: false
          });
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .createMesa(payload);
  };

  // ==========================================
  // ACTUALIZAR (en vivo)
  // ==========================================
  window.actualizarMesa = function(event) {
    event.preventDefault();

    var btn = document.querySelector('#formEditarMesa button[type="submit"]');
    var originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Guardando...';

    var mesaNum = document.getElementById('edit_mesa_num').value;
    var payload = {
      mesa_num: mesaNum,
      capacidad: document.getElementById('edit_mesa_cap').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        btn.disabled = false;
        btn.innerHTML = originalText;

        if (data.success) {
          $('#modalEditarMesa').modal('hide');

          // 🔥 ACTUALIZACIÓN EN VIVO
          actualizarFilaMesa(mesaNum, {
            capacidad: parseInt(payload.capacidad, 10)
          });

          Swal.fire({
            icon: 'success',
            title: '¡Mesa actualizada!',
            timer: 1200,
            showConfirmButton: false
          });
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .updateMesa(payload);
  };

  // ==========================================
  // CAMBIAR ESTADO (en vivo)
  // ==========================================
  window.cambiarEstadoMesa = function(mesaNum, nuevoEstado) {
    var tr = document.getElementById('mesa-row-' + mesaNum);
    var sel = tr ? tr.querySelector('.mesa-estado select') : null;
    var estadoAnterior = sel ? sel.getAttribute('data-prev') || sel.value : null;

    // Guardar estado anterior para revertir si falla
    if (sel) sel.setAttribute('data-prev', nuevoEstado);

    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        if (data.success) {
          // 🔥 Ya está reflejado en el <select>, solo actualizamos el caché
          var idx = __mesasData.findIndex(function(m) {
            return String(m.mesa_num) === String(mesaNum);
          });
          if (idx !== -1) __mesasData[idx].estado = nuevoEstado;

          Swal.fire({
            icon: 'success',
            title: 'Estado actualizado',
            timer: 1000,
            showConfirmButton: false
          });
        } else {
          // Revertir el select al estado anterior
          if (sel && estadoAnterior) sel.value = estadoAnterior;
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        if (sel && estadoAnterior) sel.value = estadoAnterior;
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .setEstadoMesa({ mesa_num: mesaNum, estado: nuevoEstado });
  };

  // ==========================================
  // ELIMINAR (en vivo)
  // ==========================================
  window.confirmDeleteMesa = function(mesaNum) {
    Swal.fire({
      title: '¿Eliminar esta mesa?',
      text: 'Esta acción no se puede deshacer.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#E2572B',
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then(function(result) {
      if (!result.isConfirmed) return;

      google.script.run
        .withSuccessHandler(function(response) {
          var data;
          try {
            data = (typeof response === 'string') ? JSON.parse(response) : response;
          } catch (e) {
            data = { success: false, message: 'Respuesta inválida' };
          }

          if (data.success) {
            // 🔥 ELIMINACIÓN EN VIVO
            eliminarFilaMesa(mesaNum);

            Swal.fire({
              icon: 'success',
              title: '¡Mesa eliminada!',
              timer: 1200,
              showConfirmButton: false
            });
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: data.message });
          }
        })
        .withFailureHandler(function(err) {
          Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
        })
        .deleteMesa({ mesa_num: mesaNum });
    });
  };
</script>
