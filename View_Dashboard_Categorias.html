<!-- View_Dashboard_Categorias.html -->
<div class="content-header p-0 mb-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h1 class="page-title m-0">Gestión de Categorías</h1>
    <button type="button" class="btn btn-navy" data-toggle="modal" data-target="#modalCrearCategoria">
      <i class="fas fa-plus mr-1"></i> Crear Categoría
    </button>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="card card-outline card-navy">
      <div class="card-body">
        <table id="categoriasTable" class="table table-striped table-hover w-100">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="categoriasTbody">
            <? if (categorias && categorias.length > 0) { ?>
              <? for (var i = 0; i < categorias.length; i++) { ?>
                <tr id="cat-row-<?= categorias[i].cat_id ?>">
                  <td class="cat-id"><?= categorias[i].cat_id ?></td>
                  <td class="cat-nombre"><?= categorias[i].nombre ?></td>
                  <td class="cat-desc"><?= categorias[i].descripcion || '' ?></td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-warning" onclick="openEditCategoriaModal(<?= categorias[i].cat_id ?>)">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDeleteCategoria(<?= categorias[i].cat_id ?>)">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              <? } ?>
            <? } ?>
          </tbody>
        </table>
        
      </div>
    </div>
  </div>
</section>

<!-- MODAL CREAR CATEGORÍA -->
<div class="modal fade" id="modalCrearCategoria" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-plus mr-2"></i>Crear Categoría</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formCrearCategoria" onsubmit="guardarCategoria(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="create_cat_nombre" class="form-control" placeholder="Ej: Hamburguesas" required>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <input type="text" id="create_cat_desc" class="form-control" placeholder="Descripción opcional">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Crear</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL EDITAR CATEGORÍA -->
<div class="modal fade" id="modalEditarCategoria" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-edit mr-2"></i>Editar Categoría</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="formEditarCategoria" onsubmit="actualizarCategoria(event)">
        <div class="modal-body">
          <input type="hidden" id="edit_cat_id">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="edit_cat_nombre" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <input type="text" id="edit_cat_desc" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-navy">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  var baseUrl = (typeof SCRIPT_URL !== 'undefined' && SCRIPT_URL) ? SCRIPT_URL : '<?= scriptUrl ?>';

  // ==========================================
  // CACHÉ LOCAL (para no recargar la página)
  // ==========================================
  var __categoriasData = <?!= json_encode(categorias) ?>;

  // ==========================================
  // HELPERS DE RENDER EN VIVO
  // ==========================================

  function catEsc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderFilaCategoria(cat) {
    return '' +
      '<tr id="cat-row-' + cat.cat_id + '">' +
        '<td class="cat-id">' + cat.cat_id + '</td>' +
        '<td class="cat-nombre">' + catEsc(cat.nombre) + '</td>' +
        '<td class="cat-desc">' + catEsc(cat.descripcion || '') + '</td>' +
        '<td class="text-center">' +
          '<button class="btn btn-sm btn-warning" onclick="openEditCategoriaModal(' + cat.cat_id + ')">' +
            '<i class="fas fa-edit"></i>' +
          '</button> ' +
          '<button class="btn btn-sm btn-danger" onclick="confirmDeleteCategoria(' + cat.cat_id + ')">' +
            '<i class="fas fa-trash"></i>' +
          '</button>' +
        '</td>' +
      '</tr>';
  }

  function toggleEmptyStateCategorias() {
    var tbody = document.getElementById('categoriasTbody');
    var empty = document.getElementById('categoriasEmpty');
    if (!tbody || !empty) return;

    var hayFilas = tbody.querySelectorAll('tr').length > 0;
    empty.style.display = hayFilas ? 'none' : 'block';
  }

  function actualizarFilaCategoria(catId, data) {
    var tr = document.getElementById('cat-row-' + catId);
    if (!tr) return;

    if (data.nombre !== undefined) {
      tr.querySelector('.cat-nombre').textContent = data.nombre;
    }
    if (data.descripcion !== undefined) {
      tr.querySelector('.cat-desc').textContent = data.descripcion || '';
    }

    // Actualizar caché
    var idx = __categoriasData.findIndex(function(c) {
      return String(c.cat_id) === String(catId);
    });
    if (idx !== -1) {
      if (data.nombre !== undefined) __categoriasData[idx].nombre = data.nombre;
      if (data.descripcion !== undefined) __categoriasData[idx].descripcion = data.descripcion;
    }
  }

  function agregarFilaCategoria(cat) {
    var tbody = document.getElementById('categoriasTbody');
    if (!tbody) return;

    // Insertar al final
    tbody.insertAdjacentHTML('beforeend', renderFilaCategoria(cat));

    // Actualizar caché
    __categoriasData.push(cat);

    // Reordenar por cat_id por si el backend devuelve un id no consecutivo
    var tbody2 = document.getElementById('categoriasTbody');
    var filas = Array.prototype.slice.call(tbody2.querySelectorAll('tr'));
    filas.sort(function(a, b) {
      var idA = parseInt(a.querySelector('.cat-id').textContent, 10) || 0;
      var idB = parseInt(b.querySelector('.cat-id').textContent, 10) || 0;
      return idA - idB;
    });
    filas.forEach(function(f) { tbody2.appendChild(f); });

    toggleEmptyStateCategorias();

    // Animación de entrada
    var nuevaFila = document.getElementById('cat-row-' + cat.cat_id);
    if (nuevaFila) {
      nuevaFila.style.opacity = '0';
      nuevaFila.style.transition = 'opacity .3s ease';
      requestAnimationFrame(function() { nuevaFila.style.opacity = '1'; });
    }
  }

  function eliminarFilaCategoria(catId) {
    var tr = document.getElementById('cat-row-' + catId);
    if (!tr) return;

    tr.style.transition = 'opacity .3s ease';
    tr.style.opacity = '0';
    setTimeout(function() {
      tr.remove();
      __categoriasData = __categoriasData.filter(function(c) {
        return String(c.cat_id) !== String(catId);
      });
      toggleEmptyStateCategorias();
    }, 300);
  }

  // ==========================================
  // ABRIR MODAL EDITAR
  // ==========================================
  window.openEditCategoriaModal = function(catId) {
    var cat = __categoriasData.find(function(c) {
      return String(c.cat_id) === String(catId);
    });

    if (!cat) {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Categoría no encontrada' });
      return;
    }

    document.getElementById('edit_cat_id').value = cat.cat_id;
    document.getElementById('edit_cat_nombre').value = cat.nombre || '';
    document.getElementById('edit_cat_desc').value = cat.descripcion || '';
    $('#modalEditarCategoria').modal('show');
  };

  // ==========================================
  // CREAR (en vivo)
  // ==========================================
  window.guardarCategoria = function(event) {
    event.preventDefault();

    var btn = document.querySelector('#formCrearCategoria button[type="submit"]');
    var originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Creando...';

    var payload = {
      nombre: document.getElementById('create_cat_nombre').value,
      descripcion: document.getElementById('create_cat_desc').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        btn.disabled = false;
        btn.innerHTML = originalText;

        if (data.success) {
          $('#modalCrearCategoria').modal('hide');

          // 🔥 ACTUALIZACIÓN EN VIVO
          if (data.categoria) {
            agregarFilaCategoria(data.categoria);
          }

          // Reset del form
          document.getElementById('formCrearCategoria').reset();

          Swal.fire({
            icon: 'success',
            title: '¡Categoría creada!',
            timer: 1200,
            showConfirmButton: false
          });
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .createCategoria(payload);
  };

  // ==========================================
  // ACTUALIZAR (en vivo)
  // ==========================================
  window.actualizarCategoria = function(event) {
    event.preventDefault();

    var btn = document.querySelector('#formEditarCategoria button[type="submit"]');
    var originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Guardando...';

    var catId = document.getElementById('edit_cat_id').value;
    var payload = {
      cat_id: catId,
      nombre: document.getElementById('edit_cat_nombre').value,
      descripcion: document.getElementById('edit_cat_desc').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        btn.disabled = false;
        btn.innerHTML = originalText;

        if (data.success) {
          $('#modalEditarCategoria').modal('hide');

          // 🔥 ACTUALIZACIÓN EN VIVO
          actualizarFilaCategoria(catId, {
            nombre: payload.nombre,
            descripcion: payload.descripcion
          });

          Swal.fire({
            icon: 'success',
            title: '¡Categoría actualizada!',
            timer: 1200,
            showConfirmButton: false
          });
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .updateCategoria(payload);
  };

  // ==========================================
  // ELIMINAR (en vivo)
  // ==========================================
  window.confirmDeleteCategoria = function(catId) {
    Swal.fire({
      title: '¿Eliminar esta categoría?',
      text: 'Esta acción no se puede deshacer.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#E2572B',
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then(function(result) {
      if (!result.isConfirmed) return;

      google.script.run
        .withSuccessHandler(function(response) {
          var data;
          try {
            data = (typeof response === 'string') ? JSON.parse(response) : response;
          } catch (e) {
            data = { success: false, message: 'Respuesta inválida' };
          }

          if (data.success) {
            // 🔥 ELIMINACIÓN EN VIVO
            eliminarFilaCategoria(catId);

            Swal.fire({
              icon: 'success',
              title: '¡Categoría eliminada!',
              timer: 1200,
              showConfirmButton: false
            });
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: data.message });
          }
        })
        .withFailureHandler(function(err) {
          Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
        })
        .deleteCategoria({ cat_id: catId });
    });
  };
</script>
