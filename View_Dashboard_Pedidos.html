<!-- View_Dashboard_Pedidos.html -->
<div class="content-header p-0 mb-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <h1 class="page-title m-0">Gestión de Pedidos</h1>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="card card-outline card-navy">
      <div class="card-body">
        <table id="pedidosTable" class="table table-striped table-hover w-100">
          <thead>
            <tr>
              <th>N° Pedido</th>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Mesa</th>
              <th>Items</th>
              <th>Total</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="pedidosTbody">
            <? if (pedidos && pedidos.length > 0) { ?>
              <? for (var i = 0; i < pedidos.length; i++) { ?>
                <? var p = pedidos[i]; ?>
                <? var cerrado = (p.estado === 'ENTREGADO' || p.estado === 'CANCELADO'); ?>
                <? var badgeClass = { PENDIENTE: 'badge-secondary', EN_PREPARACION: 'badge-warning', LISTO: 'badge-info', ENTREGADO: 'badge-success', CANCELADO: 'badge-danger' }[p.estado] || 'badge-secondary'; ?>
                <tr id="ped-row-<?= p.pedido_id ?>">
                  <td><strong class="ped-numero"><?= p.numero_pedido ?></strong></td>
                  <td class="ped-fecha"><?= formatDate(p.fecha) ?></td>
                  <td class="ped-tipo"><?= p.tipo ?></td>
                  <td class="ped-mesa"><?= p.mesa_num ? ('#' + p.mesa_num) : '-' ?></td>
                  <td class="ped-items-count"><?= p.items ? p.items.length : 0 ?></td>
                  <td class="ped-total"><?= formatCurrency(p.total) ?></td>
                  <td class="ped-estado">
                    <? if (!cerrado) { ?>
                      <select class="form-control form-control-sm d-inline-block w-auto" onchange="cambiarEstadoPedido(<?= p.pedido_id ?>, this.value)">
                        <? for (var j = 0; j < estados.length; j++) { ?>
                          <option value="<?= estados[j] ?>" <?= estados[j] === p.estado ? 'selected' : '' ?>><?= estados[j] ?></option>
                        <? } ?>
                      </select>
                    <? } else { ?>
                      <span class="badge <?= badgeClass ?>"><?= p.estado ?></span>
                    <? } ?>
                  </td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-info" onclick="verDetallePedido(<?= p.pedido_id ?>)" title="Ver detalle">
                      <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDeletePedido(<?= p.pedido_id ?>)" title="Eliminar">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              <? } ?>
            <? } ?>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- MODAL DETALLE DE PEDIDO -->
<div class="modal fade" id="modalDetallePedido" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header" style="background: var(--accent); color: white;">
        <h5 class="modal-title"><i class="fas fa-receipt mr-2"></i>Detalle del Pedido <span id="det_numero"></span></h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
          <div class="col-md-4"><strong>Tipo:</strong> <span id="det_tipo"></span></div>
          <div class="col-md-4"><strong>Mesa:</strong> <span id="det_mesa"></span></div>
          <div class="col-md-4"><strong>Estado:</strong> <span id="det_estado"></span></div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6"><strong>Cliente:</strong> <span id="det_cliente"></span></div>
          <div class="col-md-6"><strong>WhatsApp:</strong> <span id="det_wpp"></span></div>
        </div>
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cant.</th>
              <th>P. Unit.</th>
              <th>Subtotal</th>
              <th>Notas</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="det_items_body"></tbody>
        </table>
        <div class="text-right">
          <strong>Total: <span id="det_total"></span></strong>
        </div>
        <hr>
        <p id="det_observaciones" class="text-muted"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script>
  var baseUrl = (typeof SCRIPT_URL !== 'undefined' && SCRIPT_URL) ? SCRIPT_URL : '<?= scriptUrl ?>';
  var __pedidosData = <?!= json_encode(pedidos) ?>;
  var __estadosPedido = <?!= json_encode(estados) ?>;

  var ESTADO_BADGE = {
    PENDIENTE:      'badge-secondary',
    EN_PREPARACION: 'badge-warning',
    LISTO:          'badge-info',
    ENTREGADO:      'badge-success',
    CANCELADO:      'badge-danger'
  };

  function formatCurrencyJS(amount) {
    if (amount === undefined || amount === null) return '$ 0.00';
    return '$ ' + parseFloat(amount).toFixed(2);
  }

  function esCerrado(estado) {
    return estado === 'ENTREGADO' || estado === 'CANCELADO';
  }

  // ==========================================
  // HELPERS DE RENDER EN VIVO
  // ==========================================

  function renderOpcionesEstadoPedido(estadoActual) {
    return __estadosPedido.map(function(e) {
      return '<option value="' + e + '" ' + (e === estadoActual ? 'selected' : '') + '>' + e + '</option>';
    }).join('');
  }

  function renderCeldaEstadoPedido(pedidoId, estado) {
    if (esCerrado(estado)) {
      var badgeClass = ESTADO_BADGE[estado] || 'badge-secondary';
      return '<span class="badge ' + badgeClass + '">' + estado + '</span>';
    }
    return '<select class="form-control form-control-sm d-inline-block w-auto" onchange="cambiarEstadoPedido(' + pedidoId + ', this.value)">' +
      renderOpcionesEstadoPedido(estado) +
    '</select>';
  }

  function actualizarFilaPedido(pedidoId, data) {
    var tr = document.getElementById('ped-row-' + pedidoId);
    if (!tr) return;

    if (data.items_count !== undefined) {
      tr.querySelector('.ped-items-count').textContent = data.items_count;
    }
    if (data.total !== undefined) {
      tr.querySelector('.ped-total').textContent = formatCurrencyJS(data.total);
    }
    if (data.estado !== undefined) {
      var celda = tr.querySelector('.ped-estado');
      if (celda) {
        celda.innerHTML = renderCeldaEstadoPedido(pedidoId, data.estado);
      }
    }

    // Actualizar caché
    var idx = __pedidosData.findIndex(function(p) {
      return String(p.pedido_id) === String(pedidoId);
    });
    if (idx !== -1) {
      if (data.total !== undefined) __pedidosData[idx].total = data.total;
      if (data.estado !== undefined) __pedidosData[idx].estado = data.estado;
      if (data.items_count !== undefined) {
        // No tocamos el array de items, solo contamos por si acaso
      }
    }
  }

  function eliminarFilaPedido(pedidoId) {
    var tr = document.getElementById('ped-row-' + pedidoId);
    if (!tr) return;

    tr.style.transition = 'opacity .3s ease';
    tr.style.opacity = '0';
    setTimeout(function() {
      tr.remove();
      __pedidosData = __pedidosData.filter(function(p) {
        return String(p.pedido_id) !== String(pedidoId);
      });
    }, 300);
  }

  // ==========================================
  // VER DETALLE
  // ==========================================
  window.verDetallePedido = function(pedidoId) {
    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        if (!data.success || !data.pedido) {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message || 'No se pudo cargar el pedido' });
          return;
        }

        var p = data.pedido;

        // Actualizar caché con el pedido completo
        var idx = __pedidosData.findIndex(function(x) {
          return String(x.pedido_id) === String(p.pedido_id);
        });
        if (idx !== -1) {
          __pedidosData[idx] = Object.assign({}, __pedidosData[idx], p);
        } else {
          __pedidosData.push(p);
        }

        document.getElementById('det_numero').textContent = '#' + p.numero_pedido;
        document.getElementById('det_tipo').textContent = p.tipo;
        document.getElementById('det_mesa').textContent = p.mesa_num ? ('Mesa #' + p.mesa_num) : 'N/A';
        document.getElementById('det_estado').textContent = p.estado;
        document.getElementById('det_cliente').textContent = p.cliente_nombre || 'N/A';
        document.getElementById('det_wpp').textContent = p.cliente_wpp || 'N/A';
        document.getElementById('det_total').textContent = formatCurrencyJS(p.total);
        document.getElementById('det_observaciones').textContent = p.observaciones ? ('Observaciones: ' + p.observaciones) : '';

        var cerrado = esCerrado(p.estado);
        var body = document.getElementById('det_items_body');
        body.innerHTML = '';

        (p.items || []).forEach(function(item) {
          var tr = document.createElement('tr');
          tr.setAttribute('data-item-id', item.item_id);
          tr.innerHTML =
            '<td>' + item.nombre_producto + '</td>' +
            '<td>' + item.cantidad + '</td>' +
            '<td>' + formatCurrencyJS(item.precio_unitario) + '</td>' +
            '<td>' + formatCurrencyJS(item.subtotal) + '</td>' +
            '<td>' + (item.notas || '') + '</td>' +
            '<td>' + (cerrado ? '' :
              '<button class="btn btn-xs btn-danger" onclick="quitarItemPedido(' + item.item_id + ', ' + p.pedido_id + ')"><i class="fas fa-times"></i></button>'
            ) + '</td>';
          body.appendChild(tr);
        });

        $('#modalDetallePedido').modal('show');
      })
      .withFailureHandler(function(err) {
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .getPedidoById({ pedido_id: pedidoId });
  };

  // ==========================================
  // QUITAR ITEM (en vivo)
  // ==========================================
  window.quitarItemPedido = function(itemId, pedidoId) {
    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        if (data.success) {
          // 🔥 1. Quitar la fila del item en el modal (sin recargar todo)
          var tr = document.querySelector('#det_items_body tr[data-item-id="' + itemId + '"]');
          if (tr) {
            tr.style.transition = 'opacity .2s ease';
            tr.style.opacity = '0';
            setTimeout(function() { tr.remove(); }, 200);
          }

          // 🔥 2. Actualizar el total del modal
          if (data.total !== undefined) {
            document.getElementById('det_total').textContent = formatCurrencyJS(data.total);
          }

          // 🔥 3. Actualizar la fila del pedido padre (total + count items)
          var pedidoRow = document.getElementById('ped-row-' + pedidoId);
          if (pedidoRow) {
            var itemsCountCell = pedidoRow.querySelector('.ped-items-count');
            if (itemsCountCell) {
              var actual = parseInt(itemsCountCell.textContent, 10) || 0;
              itemsCountCell.textContent = Math.max(0, actual - 1);
            }
            if (data.total !== undefined) {
              pedidoRow.querySelector('.ped-total').textContent = formatCurrencyJS(data.total);
            }
          }

          // 🔥 4. Actualizar caché
          var idx = __pedidosData.findIndex(function(p) {
            return String(p.pedido_id) === String(pedidoId);
          });
          if (idx !== -1) {
            if (__pedidosData[idx].items) {
              __pedidosData[idx].items = __pedidosData[idx].items.filter(function(it) {
                return String(it.item_id) !== String(itemId);
              });
            }
            if (data.total !== undefined) __pedidosData[idx].total = data.total;
          }

          Swal.fire({ icon: 'success', title: data.message, timer: 1000, showConfirmButton: false });
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .removePedidoItem({ item_id: itemId });
  };

  // ==========================================
  // CAMBIAR ESTADO (en vivo)
  // ==========================================
  window.cambiarEstadoPedido = function(pedidoId, nuevoEstado) {
    var tr = document.getElementById('ped-row-' + pedidoId);
    var celda = tr ? tr.querySelector('.ped-estado') : null;
    var select = celda ? celda.querySelector('select') : null;
    var estadoAnterior = select ? select.getAttribute('data-prev') || select.value : null;

    if (select) select.setAttribute('data-prev', nuevoEstado);

    google.script.run
      .withSuccessHandler(function(response) {
        var data;
        try {
          data = (typeof response === 'string') ? JSON.parse(response) : response;
        } catch (e) {
          data = { success: false, message: 'Respuesta inválida' };
        }

        if (data.success) {
          // 🔥 ACTUALIZACIÓN EN VIVO
          actualizarFilaPedido(pedidoId, { estado: data.estado || nuevoEstado });

          Swal.fire({
            icon: 'success',
            title: data.message || 'Estado actualizado',
            timer: 1000,
            showConfirmButton: false
          });
        } else {
          // Revertir el select al estado anterior
          if (select && estadoAnterior) select.value = estadoAnterior;
          Swal.fire({ icon: 'error', title: 'Error', text: data.message });
        }
      })
      .withFailureHandler(function(err) {
        if (select && estadoAnterior) select.value = estadoAnterior;
        Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
      })
      .updatePedidoEstado({ pedido_id: pedidoId, estado: nuevoEstado });
  };

  // ==========================================
  // ELIMINAR PEDIDO (en vivo)
  // ==========================================
  window.confirmDeletePedido = function(pedidoId) {
    Swal.fire({
      title: '¿Eliminar este pedido?',
      text: 'Se eliminarán también todos sus productos asociados.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#E2572B',
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then(function(result) {
      if (!result.isConfirmed) return;

      google.script.run
        .withSuccessHandler(function(response) {
          var data;
          try {
            data = (typeof response === 'string') ? JSON.parse(response) : response;
          } catch (e) {
            data = { success: false, message: 'Respuesta inválida' };
          }

          if (data.success) {
            // 🔥 ELIMINACIÓN EN VIVO
            eliminarFilaPedido(pedidoId);

            Swal.fire({
              icon: 'success',
              title: '¡Pedido eliminado!',
              timer: 1200,
              showConfirmButton: false
            });
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: data.message });
          }
        })
        .withFailureHandler(function(err) {
          Swal.fire({ icon: 'error', title: 'Error de conexión', text: err.message });
        })
        .deletePedido({ pedido_id: pedidoId });
    });
  };
</script>
